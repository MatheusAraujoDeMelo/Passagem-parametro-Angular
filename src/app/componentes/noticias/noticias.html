<h2>Notícias</h2>
<section>
    @for(noticia of noticias; track noticia) {
        <div class="noticia">
            <img [src]="noticia.imagem" [alt]="noticia.titulo"/>

            <h3>
                {{ noticia.titulo }}
            </h3>

            <a routerLink="/noticia/{{ noticia.id }}">Leia Mais</a>
        </div>
    }
</section>
